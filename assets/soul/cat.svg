<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 260">
<!-- easter egg: 'bankai' -->
<defs>
<linearGradient id="blade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f4ff"/><stop offset="1" stop-color="#7fbfff"/></linearGradient>
<radialGradient id="spirit"><stop offset="0" stop-color="#7fdfff" stop-opacity="0.45"/><stop offset="1" stop-color="#7fdfff" stop-opacity="0"/></radialGradient>
</defs>
<rect width="420" height="260" fill="#060a10" rx="12"/>
<circle cx="210" cy="150" r="92" fill="url(#spirit)"><animate attributeName="r" values="84;98;84" dur="3.2s" repeatCount="indefinite"/></circle>
<!-- drifting spirit particles -->
<g fill="#7fdfff">
<circle cx="120" cy="200" r="2"><animate attributeName="cy" values="210;40" dur="4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="4s" repeatCount="indefinite"/></circle>
<circle cx="300" cy="220" r="2.5"><animate attributeName="cy" values="220;30" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="5s" repeatCount="indefinite"/></circle>
<circle cx="250" cy="210" r="1.6"><animate attributeName="cy" values="210;50" dur="3.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.9;0" dur="3.4s" repeatCount="indefinite"/></circle>
</g>
<!-- body -->
<ellipse cx="195" cy="205" rx="48" ry="34" fill="#101821"/>
<circle cx="195" cy="160" r="34" fill="#16212d"/>
<polygon points="170,137 162,108 187,131" fill="#16212d"/>
<polygon points="220,137 228,108 203,131" fill="#16212d"/>
<polygon points="172,135 167,116 184,131" fill="#3d7ea6"/>
<polygon points="218,135 223,116 206,131" fill="#3d7ea6"/>
<ellipse cx="184" cy="160" rx="6" ry="8" fill="#7fdfff"/>
<ellipse cx="206" cy="160" rx="6" ry="8" fill="#7fdfff"/>
<g fill="#060a10"><ellipse cx="184" cy="160" rx="1.6" ry="5"/><ellipse cx="206" cy="160" rx="1.6" ry="5"/></g>
<circle cx="195" cy="171" r="2.5" fill="#ff9ecf"/>
<!-- tiny zanpakuto held by paw -->
<g><animateTransform attributeName="transform" type="rotate" values="-4 272 200;4 272 200;-4 272 200" dur="2.6s" repeatCount="indefinite"/>
<rect x="269" y="128" width="6" height="82" rx="3" fill="url(#blade)"/>
<rect x="263" y="206" width="18" height="5" rx="2" fill="#c0392b"/>
<rect x="270" y="210" width="4" height="16" fill="#5a3a2a"/>
</g>
<ellipse cx="268" cy="206" rx="9" ry="6" fill="#16212d"/>
<!-- tail -->
<path d="M147,209 q-40,-4 -32,-42" stroke="#16212d" stroke-width="11" fill="none" stroke-linecap="round"><animate attributeName="d" values="M147,209 q-40,-4 -32,-42;M147,209 q-46,10 -54,-16;M147,209 q-40,-4 -32,-42" dur="2.2s" repeatCount="indefinite"/></path>
</svg>
